      - { id: setup, label: "@replayguard/vitest/setup", shape: package, tasks: [T008] }
      - { id: matchers, label: Matchers, tasks: [T007, T010] }
      - { id: norm, label: "toReport() adapter", tasks: [T003] }
      - { id: core, label: "@replayguard/core (classify, Report)", shape: package }
