      - { id: ci, label: "CI job: previous Vitest major", tasks: [T013] }
      - { id: peer, label: "peer vitest >=4 <6", shape: diamond }
      - { id: docs, label: docs/vitest/README.md, shape: package, tasks: [T014] }
      - { id: yaml, label: "diagram.yaml + quickstart", shape: package, tasks: [T015, T016] }
    edges:
      - { from: ci, to: peer }
      - { from: docs, to: peer, style: dashed }
      - { from: yaml, to: docs, style: dashed }
