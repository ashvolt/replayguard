      - { from: lead, to: tool, label: "import-jira (dry run)", tasks: [T020] }
      - { from: tool, to: lead, label: planned creates, style: dashed, tasks: [T016] }
      - { from: lead, to: tool, label: "import-jira --apply", tasks: [T019] }
      - { from: tool, to: jira, label: "create Epic → Story → Sub-task", tasks: [T018] }
