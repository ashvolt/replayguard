name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, pack and generate SBOMs without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish with provenance
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release + SBOM assets
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a verified signed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object)
          type=$(jq -r .type <<<"$object")
          sha=$(jq -r .sha <<<"$object")
          if [ "$type" != "tag" ]; then echo "::error::${TAG} is a lightweight tag; use git tag -s"; exit 1; fi
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .verification.verified)
          if [ "$verified" != "true" ]; then echo "::error::${TAG} signature is not verified"; exit 1; fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Pack public packages
        run: |
          mkdir -p dist-packages
          for dir in packages/*/; do
            if [ "$(jq -r '.private // false' "$dir/package.json")" != "true" ]; then
              (cd "$dir" && pnpm pack --pack-destination ../../dist-packages)
            fi
          done

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./packages
          format: cyclonedx-json
          output-file: dist-packages/replayguard.sbom.cdx.json
          upload-artifact: true

      - name: Publish to npm (OIDC trusted publishing, provenance)
        if: github.event_name == 'push' || inputs.dry-run == false
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm -r publish --access public --no-git-checks

      - name: GitHub release with SBOM
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist-packages/* --verify-tag --generate-notes --title "$TAG"
