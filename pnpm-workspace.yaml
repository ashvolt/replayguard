packages:
  - "packages/*"
  - "tools/*"
  - "spikes/*"
  # Standalone reproductions for upstream proposals (spec 013).
  - "upstream/*"
  - "examples/*"

# Supply-chain guard: refuse dependency versions published less than 7 days ago.
minimumReleaseAge: 10080

# Install scripts are denied unless explicitly allowed here.
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
  # Installs git hooks (pre-commit Biome + gitleaks, commit-msg check).
  lefthook: true
  "@google/genai": false
  better-sqlite3: false
  cbor-extract: false
  koffi: false
  protobufjs: false

# RivetKit's Linux engine binary ships only as a musl build (statically linked, runs on glibc);
# without this, pnpm skips it on glibc systems such as GitHub's Ubuntu runners.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current, musl]

# Security fixes for transitive dependencies of rivetkit (same major; see osv-scanner.toml).
overrides:
  qs: 6.16.1
  body-parser: 2.4.0
