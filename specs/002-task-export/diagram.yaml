      - { id: jira, label: Jira Cloud, shape: ellipse, tasks: [T019] }
      - { id: github, label: GitHub Issues, shape: ellipse, tasks: [T023] }
      - { id: linear, label: "Linear / Azure Boards", shape: ellipse }
