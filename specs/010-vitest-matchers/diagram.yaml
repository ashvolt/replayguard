      - { from: test, to: setup, label: setupFiles }
      - { from: setup, to: matchers, label: expect.extend }
      - { from: test, to: matchers, label: "expect(result)…" }
      - { from: matchers, to: norm }
      - { from: norm, to: core }
  - kind: lld
    title: "010 LLD — modules"
    layout: flow
    nodes:
      - { id: pkg, label: "package.json (exports . and ./setup)", shape: package, tasks: [T001] }
      - { id: norm, label: normalize.ts, tasks: [T002, T003] }
      - { id: viol, label: violations.ts, tasks: [T004, T005] }
      - { id: mat, label: matchers.ts (createMatcher), tasks: [T006, T007, T009, T010] }
      - { id: setup, label: setup.ts, tasks: [T008] }
      - { id: types, label: types.d.ts augmentation, tasks: [T011, T012] }
