      - { from: pkg, to: ts }
      - { from: pkg, to: vt }
      - { from: pkg, to: env, style: dashed }
      - { from: pkg, to: ghcli, style: dashed }
      - { from: pkg, to: readme }
      - { from: pkg, to: yaml }
