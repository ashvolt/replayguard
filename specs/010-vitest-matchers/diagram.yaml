      - { from: m, to: v, label: "collect fail verdicts", tasks: [T005] }
      - { from: v, to: m, label: "first 20 + '…and N more'", style: dashed, tasks: [T004] }
      - { from: m, to: dev, label: "message: case › kind subject: outcome — why", style: dashed, tasks: [T009] }
  - kind: architecture
